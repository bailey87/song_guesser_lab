<h1>雙曲干擾 Demo</h1>
<p>請辨認最先播放的歌曲。第二首只是干擾，選它不會得分。</p>
<ul>
<li>原曲實際播放滿 2 秒，加入音量為目前設定 70% 的干擾曲。</li>
<li>作答或 12 秒時間結束時，兩首一起停止。</li>
<li>久石讓專場：兩個真實曲名，加上兩首各 3／4 個近似名稱。</li>
</ul>
<a class="start" href="index.html?interference=1&amp;pool=hisaishi">試玩久石讓專場（20 首）</a>
<a class="start alt" href="index.html?interference=1">試玩全部語系（710 首）</a>
<p class="note">建議先用桌面 Chrome 與耳機試玩；手機 Safari 的雙曲播放與相對音量仍待實機確認。</p>
<p class="note">進入後先輸入暱稱並試聽，再選競速或闖關。Demo 成績另行保存；沒有開啟 Demo 的一般遊戲維持單曲播放。</p>
