<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C18">
<title>金曲猜歌王 · Song Guesser Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════
   Visual system

   Five hues, all sampled from assets/theme.png.
   Yellow (--bottle) is reserved for two things: the wordmark, and
   anything that means "you scored" — points, correct answer, threshold met.
   One typeface (Noto Serif TC); hierarchy comes from weight, not size.
   Serif horizontals are thin and vanish on dark ground, so body text
   starts at 500 and grid cells are 600.
   ═══════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;

  --night:#0B0C18;    /* page ground */
  --deep:#171A33;     /* surfaces */
  --tide:#252C55;     /* tappable (grid cells) */
  --foam:#CFCAF0;     /* foreground text */
  --bottle:#F2C86A;   /* score / correct / threshold met */
  --miss:#E08098;     /* wrong answer */

  --line:rgba(207,202,240,.16);
  --line-2:rgba(207,202,240,.32);
  --dim:rgba(207,202,240,.72);

  --face:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --w-title:900; --w-strong:700; --w-item:600; --w-body:500; --w-quiet:400;

  --t-display:clamp(2.6rem,13vw,3rem);
  --t-h1:2.25rem;
  --t-h2:1.688rem;
  --t-h3:1.266rem;
  --t-body:1rem;
  --t-small:.75rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --r-touch:12px;
  --r-input:8px;

  --ease:cubic-bezier(.2,.8,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--face);font-weight:var(--w-body);
  color:var(--foam);background:var(--night);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  text-wrap:pretty;
}

/* Hero image.
   webp, not png: same picture, 1038KB -> 82KB (quality 90). It is the
   largest single download for a first-time visitor — about 80% of the page
   weight. theme.png stays in assets/ as the master; nothing links to it.

   On a portrait phone, `cover` crops to the middle 20% of the image, which
   is exactly where the "NTUPM 18TH" wordmark sits — it would collide with
   the page title. Shifted to 90% so we see the gramophone side instead.
   The scrim is near-opaque by 32%; text starts at 37%. */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:url("assets/theme.webp") 90% center/cover no-repeat;
  filter:brightness(1.10) saturate(1.1);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,
    rgba(11,12,24,.28) 0%,
    rgba(11,12,24,.12) 20%,
    rgba(11,12,24,.88) 32%,
    rgba(11,12,24,.96) 55%,
    rgba(11,12,24,.98) 100%);
  transition:background .4s ease;
}
/* in-game: darker, fewer distractions */
body.dim::after{
  background:linear-gradient(180deg,rgba(11,12,24,.965),rgba(11,12,24,.985));
}

.screen{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:max(var(--s6),env(safe-area-inset-top)) var(--s5)
          max(var(--s6),env(safe-area-inset-bottom));
  max-width:30rem;margin:0 auto;width:100%;
}
[hidden]{display:none !important}

.rule{height:1px;background:var(--line);flex:none}

button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{
  outline:2px solid var(--foam);outline-offset:3px;border-radius:var(--r-input);
}

/* the only solid button */
.btn{
  display:block;width:100%;padding:var(--s4);
  background:var(--foam);color:var(--night);
  border-radius:var(--r-touch);
  font-weight:var(--w-strong);font-size:var(--t-h3);letter-spacing:.12em;
  transition:transform 120ms var(--ease),background 160ms var(--ease);
}
.btn:active{transform:translateY(1px);background:#B9B2E4}
.btn:disabled{background:rgba(207,202,240,.18);color:rgba(207,202,240,.4);cursor:not-allowed}
.btn.ghost{
  background:none;border:1px solid var(--line-2);
  color:var(--foam);font-weight:var(--w-body);
}
.btn.ghost:active{border-color:var(--foam);background:none}

/* ═══════════ START ═══════════ */
#screen-start{justify-content:flex-end;gap:var(--s5)}
.eyebrow{font-weight:var(--w-quiet);font-size:var(--t-small);color:var(--dim);letter-spacing:.1em}
.brand h1{
  font-weight:var(--w-title);font-size:var(--t-display);
  line-height:1.14;letter-spacing:.04em;
  margin:var(--s2) 0 var(--s3);color:var(--bottle);
}
.slogan{font-weight:var(--w-quiet);font-size:var(--t-small);line-height:2.2;color:var(--dim)}

/* underline input, like a handwritten cassette label */
.field{display:flex;align-items:center;gap:var(--s4)}
.label{flex:none;width:3rem;font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}
input[type=text]{
  flex:1;min-width:0;
  background:none;border:0;border-bottom:1px solid var(--line-2);
  padding:var(--s2) 0;color:var(--foam);
  font-family:var(--face);font-weight:var(--w-body);font-size:var(--t-h3);
  transition:border-color 160ms var(--ease);
}
input[type=text]::placeholder{color:rgba(207,202,240,.45);font-size:var(--t-body)}
input[type=text]:focus{outline:0;border-bottom-color:var(--foam)}

.entry{display:flex;flex-direction:column;gap:var(--s4)}
.sound{display:flex;flex-direction:column;gap:var(--s4)}
.sound-row{display:flex;align-items:center;gap:var(--s4)}
.sound .txt{flex:1;min-width:0;font-size:var(--t-small);line-height:1.7;color:var(--dim)}
.sound .txt b{display:block;color:var(--foam);font-weight:var(--w-strong);font-size:var(--t-body)}
.sound button{
  flex:none;padding:var(--s2) var(--s4);
  border:1px solid var(--line-2);border-radius:var(--r-input);
  font-size:var(--t-small);
}
.sound.ok .txt b{color:var(--bottle)}
/* highlight the sound block when it is the only thing left to do */
.sound.want{
  box-shadow:inset 2px 0 0 var(--bottle);
  padding-left:var(--s3);margin-left:calc(var(--s3) * -1);
  transition:box-shadow .25s var(--ease);
}

.volrow{display:flex;align-items:center;gap:var(--s4)}
.volslider{flex:1;min-width:0;height:22px;accent-color:var(--foam);cursor:pointer}
.volval{
  font-size:var(--t-small);color:var(--dim);
  min-width:2.8rem;text-align:right;font-variant-numeric:tabular-nums;
}
.volicon{
  width:16px;height:16px;flex:none;
  fill:var(--foam);stroke:var(--foam);stroke-width:1.6;stroke-linecap:round;
}
.volicon .w1,.volicon .w2{fill:none}
.volicon[data-level="0"] .w1,
.volicon[data-level="0"] .w2,
.volicon[data-level="1"] .w2{opacity:.2}

.startfoot{
  display:flex;justify-content:space-between;align-items:center;gap:var(--s4);
  font-size:var(--t-small);color:var(--dim);
}
.startfoot a{
  display:inline-flex;align-items:center;gap:var(--s2);
  color:var(--dim);text-decoration:none;padding:var(--s2) 0;
  transition:color 160ms var(--ease);
}
.startfoot a .ig{
  width:16px;height:16px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
/* underline the handle only — underlining the icon too draws a bar through it */
.startfoot a .handle{border-bottom:1px solid var(--line-2);padding-bottom:2px}
.startfoot a:active{color:var(--foam)}
.startfoot button{padding:var(--s2) 0;color:var(--dim)}

/* Attribution. Deliberately smaller and dimmer than anything else — it is
   not information for the player, it just says where the 30s clip comes from.
   The game never distributes audio; the browser streams it from Apple. */
.credit{
  margin-top:var(--s2);
  font-size:.6875rem;line-height:1.6;letter-spacing:.02em;
  color:rgba(207,202,240,.38);font-weight:var(--w-quiet);
}

/* ═══════════ LOADING ═══════════ */
#screen-load{align-items:center;justify-content:center;text-align:center;gap:var(--s5)}
.spin{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--foam);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#load-txt{max-width:20rem;font-size:var(--t-small);line-height:2.1;color:var(--dim)}
.load-retry{max-width:12rem}

/* ═══════════ PLAY ═══════════ */
#screen-play{height:100vh;height:100dvh;min-height:0;gap:var(--s4)}
/* position:relative anchors the volume panel; without it the panel drops to the page bottom */
.hud{flex:none;display:flex;flex-direction:column;gap:var(--s4);position:relative}
.hud-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.hud-top .q{font-size:var(--t-small);color:var(--dim);padding-bottom:var(--s2)}
/* the clock is the main character here: size and weight, no glow */
.hud-top .clock{
  font-weight:var(--w-title);font-size:var(--t-h1);line-height:1;
  font-variant-numeric:tabular-nums;
  min-width:4.2ch;text-align:right;   /* fixed width so ticking digits do not shift the layout */
}
.hud-top .clock.hurry{color:var(--miss)}
.volbtn{
  flex:none;width:40px;height:40px;
  border:1px solid var(--line);border-radius:var(--r-input);
  display:flex;align-items:center;justify-content:center;
  transition:border-color 160ms var(--ease);
}
.volbtn[aria-expanded="true"]{border-color:var(--foam)}
.volpanel{
  position:absolute;top:100%;left:0;right:0;z-index:5;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-input);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2);
  display:flex;align-items:center;gap:var(--s4);
}

.bar{height:2px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:100%;background:var(--foam);transform-origin:left center}
.bar i.hurry{background:var(--miss)}

/* On tall screens the cells stretch into slivers, so cap the height and put
   the slack above the grid — thumb reach matters more than centring. */
.grid{
  flex:1;min-height:0;margin-top:auto;
  max-height:calc(min(100vw, 30rem) * 1.5);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:var(--s2);
}
.opt{
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:var(--s2) var(--s1);
  background:var(--tide);border-radius:var(--r-touch);
  font-weight:var(--w-item);font-size:1.125rem;line-height:1.4;
  word-break:break-word;overflow:hidden;
  transition:transform 120ms var(--ease),opacity 200ms var(--ease),background 200ms var(--ease);
}
.opt.sm{font-size:1rem}
.opt.xs{font-size:.875rem;line-height:1.35}
.opt.xxs{font-size:.8125rem;line-height:1.3}
.opt:active{transform:scale(.96)}
/* correct answer: filled, not glowing — never colour alone */
.opt.right{background:var(--bottle);color:var(--night)}
.opt.wrong{background:none;box-shadow:inset 0 0 0 1px var(--miss);color:var(--miss)}
.opt.fade{opacity:.22}

/* The only choreographed motion: cells drop in on reveal.
   fill-mode must be backwards, not both — both locks opacity:1 after the
   animation and overrides the .fade class JS adds when showing the answer. */
@keyframes drop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid .opt{animation:drop 260ms var(--ease) backwards}
.grid .opt:nth-child(1){animation-delay:0ms}   .grid .opt:nth-child(2){animation-delay:40ms}
.grid .opt:nth-child(3){animation-delay:80ms}  .grid .opt:nth-child(4){animation-delay:60ms}
.grid .opt:nth-child(5){animation-delay:100ms} .grid .opt:nth-child(6){animation-delay:140ms}
.grid .opt:nth-child(7){animation-delay:120ms} .grid .opt:nth-child(8){animation-delay:160ms}
.grid .opt:nth-child(9){animation-delay:200ms}

.hud-bot{
  flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);
  font-size:var(--t-small);color:var(--dim);
}
.hud-bot b{font-weight:var(--w-strong);font-size:var(--t-h3);color:var(--bottle);font-variant-numeric:tabular-nums}

/* wraps: long song titles used to overflow with nowrap */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--s5));
  width:min(calc(30rem - var(--s6)), calc(100vw - var(--s6)));
  transform:translateX(-50%);
  padding:var(--s3) var(--s4);border-radius:var(--r-input);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2);
  font-size:var(--t-small);line-height:1.6;text-align:center;
  animation:rise .2s var(--ease);
}
.toast.good{color:var(--bottle)}
.toast.bad{color:var(--miss)}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* ═══════════ RESULT ═══════════ */
#screen-result{justify-content:flex-end;gap:var(--s5)}
.scorecard .title{font-weight:var(--w-title);font-size:var(--t-h2);line-height:1.2;color:var(--foam)}
.scorecard .line{font-weight:var(--w-quiet);font-size:var(--t-small);line-height:1.9;color:var(--dim);margin-top:var(--s2)}
.scorecard .line:empty{display:none}
.scorecard .big{
  font-weight:var(--w-title);font-size:var(--t-display);line-height:1;
  color:var(--bottle);font-variant-numeric:tabular-nums;margin:var(--s4) 0 var(--s2);
}
.scorecard .meta{font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}

/* Personal-record and retry hints. */
.scorecard .next{
  margin-top:var(--s3);font-size:var(--t-small);line-height:1.8;
  color:var(--dim);font-weight:var(--w-quiet);
}
.scorecard .next b{color:var(--bottle);font-weight:var(--w-item)}

/* IG on the result screen: longest dwell time of any screen, so bump it a size and centre it */
#screen-result .startfoot{justify-content:center}
#screen-result .startfoot a{
  font-size:var(--t-body);font-weight:var(--w-item);color:var(--foam);gap:var(--s3);
}
#screen-result .startfoot a .ig{width:22px;height:22px;stroke-width:1.6}
#screen-result .startfoot a .handle{padding-bottom:3px}

/* Welcome-session card.
   The result screen is where players linger and where they feel best, so it
   is the only place worth pitching the club. It must not compete with the
   score: yellow goes to the label and dates only, the heading takes the
   foreground colour, everything else is --dim. One 1px inset border, no shadow. */
.promo{
  padding:var(--s4);border-radius:var(--r-touch);
  background:rgba(23,26,51,.62);
  box-shadow:inset 0 0 0 1px var(--line);
}
.promo .tag{
  display:flex;align-items:center;gap:var(--s3);
  margin:0 0 var(--s3);
  font-size:var(--t-body);font-weight:var(--w-strong);
  color:var(--bottle);letter-spacing:.12em;
}
/* fading rule to the right of the label, pulling the eye onto the dates */
.promo .tag::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(242,200,106,.5),rgba(242,200,106,0));
}
.promo ul{margin:0;padding:0;list-style:none}
.promo li{
  display:grid;grid-template-columns:auto auto 1fr;gap:var(--s3);align-items:baseline;
  padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-small);
}
.promo li .d{
  font-weight:var(--w-title);font-size:var(--t-h3);color:var(--bottle);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.promo li .t{font-weight:var(--w-item);color:var(--foam);font-variant-numeric:tabular-nums}
/* weekday is secondary — the date identifies the session, the weekday just helps people check their timetable */
.promo li .t i{font-style:normal;font-weight:var(--w-quiet);color:var(--dim);margin-right:.4em}
/* the venue matters as much as the time: people have to walk there */
.promo li .p{font-weight:var(--w-item);color:var(--foam);text-align:right;white-space:nowrap}
.promo .note{
  margin:var(--s3) 0 0;font-size:var(--t-small);font-weight:var(--w-quiet);
  color:var(--dim);line-height:1.7;
}

.misses{display:flex;flex-direction:column}
.misses h4{margin:0 0 var(--s3);font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}
.misses ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.misses li{
  display:flex;justify-content:space-between;gap:var(--s4);
  padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-small);
}
.misses li b{font-weight:var(--w-item);color:var(--foam)}
.misses li span{color:var(--dim)}
.misses .none{color:var(--bottle);font-size:var(--t-small)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}

/* Share button. It does not compete with "play again": ghost style, own row.
   The icon is there because this action leaves the app, unlike the other two. */
.btn.share{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  font-size:var(--t-body);letter-spacing:.08em;padding:var(--s3);
}
.btn.share svg{
  width:20px;height:20px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}

/* ═══════════ MODE BUTTONS ═══════════
   Second line inside each button is the player's own record. The question
   this screen has to answer is "which one do I play", and that line is the
   evidence. */
.modes{display:flex;flex-direction:column;gap:var(--s3)}
.modes .btn{padding:var(--s3) var(--s4);line-height:1.35}
.modes .btn .t{display:block}
.modes .btn .sub{
  display:block;margin-top:2px;
  font-size:var(--t-small);font-weight:var(--w-quiet);letter-spacing:.02em;
  opacity:.72;
}
.modes .btn .sub:empty{display:none}

/* ═══════════ STAGE MODE: in-game header ═══════════
   A growing song pool is the only reward this mode gives, and it is
   invisible. Unless it is on screen, players just feel the questions got
   harder. So it stays up for the whole stage. */
.hud-stage{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  font-size:var(--t-small);line-height:1.4;
}
.hud-stage .lv{
  font-weight:var(--w-strong);color:var(--bottle);letter-spacing:.08em;flex:none;
}
.hud-stage .un{
  color:var(--dim);font-weight:var(--w-quiet);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hud-bot em{font-style:normal;color:var(--dim);font-weight:var(--w-quiet)}

/* ═══════════ STAGE MODE: clear popup ═══════════
   Sits over the grid instead of switching screens, so the game feels paused
   rather than left. Three beats: scrim dims, card rises, unlock line lands
   last. Under half a second total — this is a reward, not a transition. */
.pop{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;padding:var(--s5);
  background:rgba(11,12,24,.72);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .18s var(--ease);
}
.pop.in{opacity:1}
.pop-card{
  width:min(22rem,100%);
  padding:var(--s5);border-radius:var(--r-touch);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2), 0 18px 48px rgba(0,0,0,.5);
  transform:translateY(14px) scale(.96);opacity:0;
}
.pop.in .pop-card{animation:popcard .34s var(--ease) .06s both}
@keyframes popcard{to{transform:none;opacity:1}}

.pop-card .tag{
  font-size:var(--t-small);font-weight:var(--w-item);
  color:var(--dim);letter-spacing:.22em;
}
.pop-card .big{
  margin:var(--s2) 0 0;
  font-weight:var(--w-title);font-size:var(--t-h2);line-height:1.25;color:var(--bottle);
}
.pop.in .pop-card .big{animation:poprise .36s var(--ease) .16s both}
@keyframes poprise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.pop-card .line{
  margin-top:var(--s3);font-size:var(--t-small);line-height:1.9;
  color:var(--dim);font-weight:var(--w-quiet);
}
.pop-card .line:empty{display:none}
.pop-card .facts{
  margin:var(--s4) 0 var(--s5);padding:0;list-style:none;
  display:flex;flex-direction:column;
}
.pop.in .pop-card .facts{animation:poprise .36s var(--ease) .24s both}
.pop-card .facts li{
  display:flex;justify-content:space-between;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-small);
}

}
</style>
</head>

<!-- ═══════════ STAGE MODE: clear popup ═══════════

<script src="songs.js"></script>
<script src="decoys.js"></script>
<script src="previews.js"></script>
<script src="song-rotation.js"></script>
<script src="named-decoys.js"></script>
<script>
/* Static single-player game. Audio streams from Apple; progress stays local. */

const CONFIG = {
  questionCount: 10,      // questions per round
  // Every category is available from the first round.
  floor: { mando: 1, classic: 1, tw: 1, west: 1, kpop: 1, jp: 1 },
  optionCount: 9,
  timeLimit: 12,          // seconds per question
  baseScore: 300,         // points for a correct answer
  speedScore: 700,        // speed bonus cap (300+700=1000, so 10 questions max at 10000)
  revealMs: 2200,         // answer-reveal pause
  clipSeconds: 15,        // clip length
  maxSameArtist: 2        // max cells one artist may occupy
};

const $ = id => document.getElementById(id);
/* ---------- Stage table: the full library is open at every level ---------- */
const STAGE_SECONDS = 12;
const STAGE_QUESTIONS = 10;
const STAGES = [4000, 5000, 6000, 7000, 8000, 9000].map(need => ({
  need, floor: CONFIG.floor
}));
function stageHudLabel(){ return '全語系開放'; }
function stagePool(){ return window.SONGS || []; }

// Rules for the current round, filled in per mode. The game loop reads this, not CONFIG.
const R = { questionCount: CONFIG.questionCount, timeLimit: CONFIG.timeLimit };

const SCREENS = ['screen-start','screen-load','screen-play','screen-result'];
function show(id){
  SCREENS.forEach(s => $(s).hidden = (s !== id));
  document.body.classList.toggle('dim', id === 'screen-play');
  window.scrollTo(0,0);
}

/* ---------- helpers ---------- */
const shuffle = arr => {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
};
const hashCode = str => { let h=0; for(const ch of str) h=(h*31+ch.charCodeAt(0))|0; return h; };
const seeded = seed => { let s=seed>>>0; return () => { s=(s*1664525+1013904223)>>>0; return s/4294967296; }; };
const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);

/* ---------- audio ---------- */
let audioCtx = null;
function ensureCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* ---------- volume ---------- */
// Persisted: the same phone should not have to set it again.
// It was the most-touched control at the fair, where people shared headphones.
const VOL_KEY = 'pmsg_volume_v1';
let volume = 0.8;
try{
  const v = parseFloat(localStorage.getItem(VOL_KEY));
  if(v >= 0 && v <= 1) volume = v;
}catch(e){}

function setVolume(v){
  volume = Math.min(1, Math.max(0, v));
  try{ localStorage.setItem(VOL_KEY, String(volume)); }catch(e){}

  // applies live to prepared clips and to the synth fallback
  (G.questions || []).forEach(q => { if(q.audio && q.audio.el) q.audio.el.volume = volume; });
  if(G.clip && G.clip.setVolume) G.clip.setVolume(volume);

  const pct = Math.round(volume * 100);
  document.querySelectorAll('.volslider').forEach(el => { if(+el.value !== pct) el.value = pct; });
  document.querySelectorAll('.volval').forEach(el => { el.textContent = pct + '%'; });
  document.querySelectorAll('.volicon').forEach(el => {
    el.dataset.level = volume === 0 ? '0' : volume < 0.5 ? '1' : '2';
  });
}

// Try one audio source; null if it will not load.
//
// Resolves on canplay/loadeddata, not canplaythrough: the latter waits until
// the whole clip is buffered, which with several ~1MB downloads in flight
// routinely blew the timeout and dropped the whole round to the synth
// fallback. Metadata is enough to know the source works.
function probeAudio(src, timeoutMs){
  return new Promise(resolve => {
    const a = new Audio(src);
    a.preload = 'metadata';   // probe only; switched to auto once this source is chosen
    let settled = false;
    const ok = () => { if(!settled){ settled = true; resolve(a); } };
    const no = () => { if(!settled){ settled = true; resolve(null); } };
    a.addEventListener('canplay', ok, {once:true});
    a.addEventListener('loadeddata', ok, {once:true});
    a.addEventListener('loadedmetadata', ok, {once:true});
    a.addEventListener('error', no, {once:true});
    setTimeout(no, timeoutMs);
    a.load();
  });
}

// Source order: local file -> Apple preview (streamed, never stored) -> synth
//
// One at a time. Probing all ten up front makes Chrome stall every media
// load at once and the round silently falls back to the synth. One load takes
// ~70ms; sixteen together never finish.
let hasLocalAudio = null;   // null = untried, false = audio/ is empty, stop asking

async function prepareClip(q, remoteTimeout = 12000){
  if(q.audio !== undefined) return q.audio;   // already prepared, or known to have none
  const song = q.song;

  let el = null, source = null, offset = 0;

  if(hasLocalAudio !== false){
    el = await probeAudio(`audio/${song.id}.m4a`, 2500);
    if(el){ hasLocalAudio = true; source = 'local'; }
    else if(hasLocalAudio === null) hasLocalAudio = false;   // nothing for the first song: treat the folder as empty
  }

  if(!el){
    const p = (window.SONG_PREVIEWS || {})[song.id];
    if(p && p.url){
      el = await probeAudio(p.url, remoteTimeout);
      if(el){ source = 'preview'; offset = p.offset || 0; }
    }
  }

  if(el){ el.volume = volume; el.preload = 'auto'; try{ el.load(); }catch(e){} }   // buffer ahead only once chosen
  q.audio = el ? { el, source, offset } : null;
  return q.audio;
}

function note(ctx, dest, freq, at, dur, type, peak){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(g); g.connect(dest);
  osc.start(at); osc.stop(at + dur + 0.05);
  return osc;
}

// deterministic placeholder melody per song id
function synthClip(song, seconds){
  const ctx = ensureCtx();
  if(!ctx) return { stop(){} };
  const rnd = seeded(hashCode(song.id));
  const master = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 2400;
  master.connect(filter); filter.connect(ctx.destination);
  master.gain.setValueAtTime(volume, ctx.currentTime);

  const scale = [0,2,4,7,9,12,14,16,19];
  const root = 45 + Math.floor(rnd()*8);
  const beat = 60 / (80 + Math.floor(rnd()*45));
  const t0 = ctx.currentTime + 0.06;
  const oscs = [];
  let t = t0, i = 0;
  while(t < t0 + seconds){
    oscs.push(note(ctx, master, midiToFreq(root+12+scale[Math.floor(rnd()*scale.length)]), t, beat*0.85, 'triangle', 0.16));
    if(i % 2 === 0) oscs.push(note(ctx, master, midiToFreq(root), t, beat*1.5, 'sine', 0.22));
    t += beat*0.5; i++;
  }
  let stopped = false;
  return {
    stop(){
      stopped = true;
      const now = ctx.currentTime;
      try{
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(master.gain.value, now);
        master.gain.linearRampToValueAtTime(0.0001, now + 0.08);
      }catch(e){}
      oscs.forEach(o => { try{ o.stop(now + 0.1); }catch(e){} });
    },
    // ignore volume once stopped, or the slider revives a silenced clip
    setVolume(v){ if(stopped) return; try{ master.gain.setTargetAtTime(v, ctx.currentTime, 0.02); }catch(e){} }
  };
}

// When the browser blocks playback (iOS mute switch, lost user gesture), say so.
// A running clock with no sound and no error is the worst way to fail.
function onPlayBlocked(q){
  $('playmeta').textContent = '沒有聲音?點一下畫面';
  const retry = () => {
    ensureCtx();
    const el = q.audio && q.audio.el;
    if(el) el.play().then(() => { $('playmeta').textContent = ''; }).catch(() => {});
  };
  document.addEventListener('pointerdown', retry, { once: true });
}

function playClip(q){
  if(q.audio && q.audio.el){
    try{
      q.audio.el.volume = volume;
      q.audio.el.currentTime = q.audio.offset || 0;
      const p = q.audio.el.play();
      if(p && p.catch) p.catch(() => onPlayBlocked(q));
      return { stop(){ try{ q.audio.el.pause(); }catch(e){} } };
    }catch(e){ onPlayBlocked(q); }
  }
  return synthClip(q.song, CONFIG.clipSeconds);
}

/* ---------- Personal records (local device only) ---------- */
const Store = {
  KEY: 'pmsg_scores_full_library_v2',

  all(){
    try{ return JSON.parse(localStorage.getItem(this.KEY)) || []; }
    catch(e){ return []; }
  },

  save(entry){
    const list = this.all();
    list.push(entry);
    // keep the last 50; nobody reads further back and localStorage has a cap
    try{ localStorage.setItem(this.KEY, JSON.stringify(list.slice(-50))); }catch(e){}
  },

  // Personal speed-mode best; stage scores use their own progression.
  best(){
    return this.all().reduce((m, r) => r.mode === 'stage' ? m : Math.max(m, r.score || 0), 0);
  },
  plays(){ return this.all().length; },

  // stage-mode record: only ever goes up
  STAGE_KEY: 'pmsg_stage_full_library_v2',
  bestStage(){
    try{ return Number(localStorage.getItem(this.STAGE_KEY)) || 0; }catch(e){ return 0; }
  },
  noteStage(n){
    if(n > this.bestStage()){ try{ localStorage.setItem(this.STAGE_KEY, String(n)); }catch(e){} }
  }
};

/* ---------- question building ---------- */

// Display title, with subtitles stripped.
// Answers are hand-written and already clean; decoys come from the Apple
// store and often carry one. Unstripped, the cell without brackets is the answer.
function cleanTitle(t){
  const s = String(t || '')
    .replace(/\s*[（(【\[].*$/, '')   // drops (theme from ...) and (movie ver.)
    .replace(/\s+[-–—]\s+.*$/, '')    // 「 - A Rock Can Be A Star」「 - Single Version」
    .trim();                          // the dash needs spaces around it, or DDU-DU DDU-DU loses half its name
  return s || String(t || '');
}

// Dedupe key for the grid, lowercased. HAPPY by DAY6 and Happy by Pharrell
// Williams are different songs that look identical in a cell.
function titleKey(t){ return cleanTitle(t).toLowerCase(); }

// size by title length: all nine cells must fit one screen without scrolling
function sizeClass(label){
  const cjk = /[㐀-鿿぀-ヿ]/.test(label);
  const n = label.length;
  if(cjk ? n >= 11 : n >= 20) return ' xxs';
  if(cjk ? n >= 9  : n >= 14) return ' xs';
  if(cjk ? n >= 6  : n >= 9)  return ' sm';
  return '';
}

// option pool = song bank + decoy titles
function optionPool(){
  return (window.SONGS || []).concat(window.DECOYS || []);
}

/* Both modes use the full library and the same category floors.
   Persistent rotation prefers unseen songs, then least-recently-played. */
function buildQuestions(songs, floor){
  songs = songs || window.SONGS || [];

  const answers = shuffle(songRotation.draw(songs, R.questionCount, floor));

  const pool = optionPool();
  let lastIndex = -1;

  return answers.map(answer => {
    const options = [answer];
    const usedTitle = new Set([titleKey(answer.title)]);
    const byArtist = { [answer.artist]: 1 };

    // These labels are intentionally invented and tied to this one question.
    // They do not enter the real song pool or represent artist recordings.
    for(const title of shuffle((window.NAMED_DECOYS || {})[answer.id] || [])){
      if(options.length >= CONFIG.optionCount) break;
      const key = titleKey(title);
      if(usedTitle.has(key)) continue;
      usedTitle.add(key);
      options.push({ title, artist: answer.artist, genre: answer.genre, invented: true });
    }

    // Prefer same-genre decoys. A Mandarin answer among English titles is
    // solvable by elimination, which collapses the nine-way choice.
    const passes = [
      { list: pool.filter(o => o.genre === answer.genre), max: CONFIG.maxSameArtist },
      { list: pool, max: CONFIG.maxSameArtist },
      { list: pool, max: Infinity }
    ];
    for(const pass of passes){
      if(options.length >= CONFIG.optionCount) break;
      for(const o of shuffle(pass.list)){
        if(options.length >= CONFIG.optionCount) break;
        const key = titleKey(o.title);
        if(usedTitle.has(key)) continue;
        if((byArtist[o.artist] || 0) >= pass.max) continue;
        usedTitle.add(key);
        byArtist[o.artist] = (byArtist[o.artist] || 0) + 1;
        options.push(o);
      }
    }

    const grid = shuffle(options);
    // never put the answer in the same cell twice running
    let idx = grid.indexOf(answer);
    if(idx === lastIndex && grid.length > 1){
      const swap = (idx + 1 + Math.floor(Math.random()*(grid.length-1))) % grid.length;
      [grid[idx], grid[swap]] = [grid[swap], grid[idx]];
      idx = swap;
    }
    lastIndex = idx;
    // audio is deliberately left unset: prepareClip reads undefined as not-yet-tried,
    // whereas null would mean known-to-have-no-source and skip probing
    return { song: answer, options: grid };
  });
}

const songRotation = new SongRotation();

/* ---------- game state ---------- */
const G = {
  nickname: '',
  questions: [], index: 0, total: 0, log: [],
  mode: 'speed', stage: 1,
  soundOk: false, timer: null, clip: null, deadline: 0, locked: false
};

/* ---------- start screen ---------- */


const BANNED = ['幹','靠北','白痴','智障','媽的','雞掰','三小','fuck','shit','bitch'];
function nickError(v){
  const n = v.trim();
  if(n.length < 2) return '暱稱至少 2 個字';
  if(n.length > 8) return '暱稱最多 8 個字';
  const low = n.toLowerCase();
  if(BANNED.some(w => low.includes(w))) return '這個暱稱會出現在公開螢幕上,換一個吧';
  return null;
}

// A greyed-out button with no reason is where this screen loses people; at the
// fair nobody investigated, they just assumed it was broken and left. So the
// button always says what is missing, with detail under the nickname field.
function refreshStartBtn(){
  const raw = $('nick').value;
  const err = nickError(raw);
  const typed = raw.trim().length > 0;

  const why =
    !typed     ? '請先輸入暱稱' :
    err        ? '暱稱不能用'   :
    !G.soundOk ? '請先測試聲音' : null;

  for(const [id, label] of [['btn-speed','競速模式'], ['btn-stage','闖關模式']]){
    $(id).disabled = !!why;
    $(id).querySelector('.t').textContent = why || label;
  }
  const bestStage = Store.bestStage();
  $('stage-best').textContent = why ? ''
    : (bestStage ? `最佳紀錄 第 ${bestStage} 關` : '六關,一關比一關難');
  $('speed-best').textContent = why ? ''
    : (Store.best() ? `你的最佳 ${Store.best().toLocaleString()} 分` : '十題,比分數');

  // no error until they have actually typed something
  showNickError(typed ? err : '');
  // nickname done but sound untested: pull the eye to the sound block
  $('sound').classList.toggle('want', !err && typed && !G.soundOk);
}

$('nick').addEventListener('input', refreshStartBtn);   // refreshStartBtn owns the messaging

$('btn-test').addEventListener('click', () => {
  const ctx = ensureCtx();
  if(!ctx){
    alert('這支瀏覽器不支援音訊播放,請換一個瀏覽器開啟。');
    return;
  }
  // testing at volume 0 reads as broken, so nudge it up first
  if(volume === 0) setVolume(0.5);

  // short rising arpeggio; also unlocks audio playback on mobile
  const t = ctx.currentTime + 0.05;
  [0,4,7,12].forEach((semi,i) =>
    note(ctx, ctx.destination, midiToFreq(69+semi), t + i*0.13, 0.3, 'triangle', 0.2 * volume));
  G.soundOk = true;
  $('sound').classList.add('ok');
  $('sound').querySelector('b').textContent = '聲音沒問題!';
  $('btn-test').textContent = '再聽一次';
  refreshStartBtn();
});

/* ---------- volume control ---------- */
document.querySelectorAll('.volslider').forEach(el =>
  el.addEventListener('input', e => setVolume(e.target.value / 100)));

$('btn-vol').addEventListener('click', () => {
  const panel = $('volpanel');
  const opening = panel.hidden;
  panel.hidden = !opening;
  $('btn-vol').setAttribute('aria-expanded', String(opening));
});

$('btn-speed').addEventListener('click', () => startGame('speed'));
$('btn-stage').addEventListener('click', () => startGame('stage'));
$('btn-again').addEventListener('click', () =>
  G.mode === 'stage' ? startGame('stage') : show('screen-start'));
$('btn-home').addEventListener('click', () => show('screen-start'));

/* ---------- starting a round ---------- */

// Load the first clip. Waiting is fine, as long as the player can see why.
// Silently downgrading to the synth is the worst option: no error on screen,
// a round nobody can answer, and no clue anything went wrong.
async function loadFirst(){
  const q = G.questions[0];
  q.audio = undefined;                 // re-probe on retry
  $('load-spin').hidden = false;
  $('btn-retry').hidden = true;
  $('load-txt').textContent = '正在準備第一首⋯';

  const t0 = Date.now();
  const ticker = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if(s >= 10)     $('load-txt').textContent = `網路好像不太順,還在等⋯(${s} 秒)`;
    else if(s >= 4) $('load-txt').textContent = '網路好像有點慢,再等一下⋯';
  }, 1000);

  const clip = await prepareClip(q, 25000);   // 25s for the first one: slow beats a silent downgrade
  clearInterval(ticker);
  if(clip) return true;

  $('load-spin').hidden = true;
  $('load-txt').innerHTML = '載不到音樂 —— 可能是網路不通。<br>確認一下網路,或換個網路再試一次。';
  $('btn-retry').hidden = false;
  return false;
}

$('btn-retry').addEventListener('click', async () => {
  if(await loadFirst()){ show('screen-play'); nextQuestion(); }
});

function showNickError(msg){
  const el = $('nick-err');
  el.textContent = msg || '';
  el.hidden = !msg;
}

async function startGame(mode){
  const err = nickError($('nick').value);
  if(err){ showNickError(err); return; }
  showNickError('');

  // The nickname and personal results stay on this device.
  G.nickname = $('nick').value.trim();
  G.mode = mode;
  G.stage = 1;
  await playRound();
}

/* One round: ten questions in speed mode, one stage in stage mode. The modes
   differ only in rules and song pool; loading, timing and scoring are shared. */
async function playRound(){
  if(G.mode === 'stage'){
    const st = STAGES[G.stage - 1];
    Object.assign(R, { questionCount: STAGE_QUESTIONS, timeLimit: STAGE_SECONDS });
    G.questions = buildQuestions(stagePool(G.stage), st.floor);
    $('hud-lv').textContent = `第 ${G.stage} 關`;
    $('hud-un').textContent = `${stageHudLabel(G.stage)} · ${stagePool(G.stage).length} 首`;
    $('goal').textContent = ` / ${STAGES[G.stage - 1].need.toLocaleString()}`;
  }else{
    Object.assign(R, { questionCount: CONFIG.questionCount, timeLimit: CONFIG.timeLimit });
    G.questions = buildQuestions(window.SONGS, CONFIG.floor);
    $('goal').textContent = '';
  }
  $('hud-stage').hidden = G.mode !== 'stage';
  G.index = 0; G.total = 0; G.log = [];

  show('screen-load');
  if(!await loadFirst()) return;   // stay on the loading screen to retry rather than starting anyway

  show('screen-play');
  nextQuestion();
}

async function nextQuestion(){
  const q = G.questions[G.index];
  G.locked = true;                       // no answers accepted until the clip is ready

  // the volume panel overlaps the grid, so close it between questions
  $('volpanel').hidden = true;
  $('btn-vol').setAttribute('aria-expanded', 'false');

  $('qnum').textContent = `第 ${G.index+1} 題,共 ${R.questionCount} 題`;
  $('running').textContent = G.total.toLocaleString();
  $('clock').textContent = R.timeLimit.toFixed(1);
  $('clock').classList.remove('hurry');
  $('barfill').style.transform = 'scaleX(1)';
  $('barfill').classList.remove('hurry');

  const grid = $('grid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const label = cleanTitle(opt.title);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + sizeClass(label);
    b.textContent = label;
    b.addEventListener('click', () => answer(opt, i));
    grid.appendChild(b);
  });

  if(q.audio === undefined) $('playmeta').textContent = '載入中⋯';   // only visible when the prefetch has not finished
  await prepareClip(q);
  $('playmeta').textContent = q.audio ? '' : '示範音 · 這首找不到音源';

  if(G.clip) G.clip.stop();
  G.clip = playClip(q);

  songRotation.record(q.song.id, window.SONGS);
  G.locked = false;
  G.deadline = performance.now() + R.timeLimit * 1000;
  tick();

  // prefetch the next clip while this one plays, so questions do not stall
  const nx = G.questions[G.index + 1];
  if(nx) prepareClip(nx);
}

function tick(){
  const left = Math.max(0, (G.deadline - performance.now()) / 1000);
  const ratio = left / R.timeLimit;
  $('clock').textContent = left.toFixed(1);
  $('clock').classList.toggle('hurry', left <= 4);
  $('barfill').style.transform = `scaleX(${ratio})`;
  $('barfill').classList.toggle('hurry', left <= 4);

  if(left <= 0){ answer(null, -1); return; }
  G.timer = requestAnimationFrame(tick);
}

function answer(opt, index){
  if(G.locked) return;
  G.locked = true;
  cancelAnimationFrame(G.timer);
  if(G.clip) G.clip.stop();

  const q = G.questions[G.index];
  const left = Math.max(0, (G.deadline - performance.now()) / 1000);
  const correct = opt === q.song;
  const gained = correct
    ? Math.round(CONFIG.baseScore + CONFIG.speedScore * (left / R.timeLimit))
    : 0;

  G.total += gained;
  G.log.push({ song: q.song, correct, gained, seconds: +(R.timeLimit - left).toFixed(1) });

  // mark the answer, fade the rest
  const rightIndex = q.options.indexOf(q.song);
  [...$('grid').children].forEach((el, i) => {
    if(i === rightIndex) el.classList.add('right');
    else if(i === index) el.classList.add('wrong');
    else el.classList.add('fade');
  });
  $('running').textContent = G.total.toLocaleString();

  const t = toast(correct
    ? `答對了,${q.song.title} +${gained} 分`
    : (opt ? `答錯了。這首是${q.song.artist}的〈${q.song.title}〉`
           : `時間到。這首是${q.song.artist}的〈${q.song.title}〉`),
    correct ? 'good' : 'bad');

  setTimeout(() => {
    t.remove();
    G.index++;
    if(G.index >= R.questionCount) finish();
    else nextQuestion();
  }, CONFIG.revealMs);
}

/* ---------- result ---------- */

/* ╔══════════════════════════════════════════════════════════════╗
   ║  Titles. Edit this table to change the copy; nothing below cares. ║
   ╚══════════════════════════════════════════════════════════════╝

   min    score threshold, checked top-down; first `score >= min` wins.
          Maximum is 10000 (10 questions x 1000).
   title  what the player screenshots and sends to friends — keep it short.
   line   the line under the title. Use '' for none.

   Add or remove rows freely; the code follows. The last row must have
   min: 0 — that is the catch-all. */

const TITLES = [
  { min: 8000, title: '猜歌之王', line: '耳朵就是你的超能力！' },
  { min: 6767, title: '金曲點唱機', line: '你的歌單一定很精彩！' },
  { min: 5000, title: '移動 KTV', line: '再快一點，就能更上一層樓！' },
  { min: 3000, title: '持續聽歌中', line: '再挑戰一次，發現更多好歌！' },
  { min: 0, title: '聽歌小萌新', line: '每一首都是認識新音樂的機會！' }
];

function titleFor(score){
  return TITLES.find(t => score >= t.min) || TITLES[TITLES.length - 1];
}

function finish(){
  if(G.mode === 'stage') return finishStage();

  const entry = {
    nickname: G.nickname,
    mode: 'speed',
    score: G.total,
    correct: G.log.filter(r => r.correct).length,
    at: Date.now()
  };
  const prevBest = Store.best();
  Store.save(entry);
  $('btn-again').textContent   = '再玩一次';

  const rank = titleFor(G.total);
  $('res-title').textContent = rank.title;
  $('res-line').textContent  = rank.line;
  $('res-score').textContent = G.total.toLocaleString();

  G.shareText = `我在金曲猜歌王獲得了 ${G.total.toLocaleString()} 分，答對 ${entry.correct}/${R.questionCount} 題，得到「${rank.title}」！你也來挑戰看看吧！`;
  $('res-meta').textContent = `答對 ${entry.correct} 題,共 ${R.questionCount} 題`;
  const nextEl = $('res-next');
  nextEl.textContent = prevBest && G.total > prevBest
    ? `這支裝置的新紀錄（上次最好 ${prevBest.toLocaleString()} 分）` : '';
  nextEl.hidden = !nextEl.textContent;

  // the ones they missed
  const missed = G.log.filter(r => !r.correct);
  $('res-misses').innerHTML = missed.length
    ? `<h4>沒答出來的</h4><ul>${missed.map(r =>
        `<li><b>${escapeHtml(r.song.title)}</b><span>${escapeHtml(r.song.artist)}</span></li>`).join('')}</ul>`
    : `<h4>全對</h4><div class="none">十題全中,一首都沒漏</div>`;

  show('screen-result');
}

/* ---------- stage mode result ---------- */

function stageFacts(st, passed){
  const rows = [
    [`這一關`, `${G.total.toLocaleString()} / ${st.need.toLocaleString()} 分`, passed]
  ];
  const next = STAGES[G.stage];
  if(passed && next){
    rows.push([`曲庫`, `${stagePool().length} 首 · 全語系開放`, true]);
    rows.push([`第 ${G.stage + 1} 關`, `要 ${next.need.toLocaleString()} 分`, false]);
  }
  return rows.map(([k, v, hot]) =>
    `<li><span class="k">${k}</span><span class="v${hot ? ' hot' : ''}">${v}</span></li>`).join('');
}

function finishStage(){
  const st = STAGES[G.stage - 1];
  const passed = G.total >= st.need;
  const cleared = passed ? G.stage : G.stage - 1;   // stages actually cleared
  Store.noteStage(cleared);
  Store.save({ nickname: G.nickname, mode: 'stage', stage: cleared, score: G.total, at: Date.now() });

  if(!passed) return failStage(st);

  const last = G.stage >= STAGES.length;
  const pop = $('pop');
  pop.classList.toggle('clear', last);
  $('st-tag').textContent  = last ? '全部破關' : `第 ${G.stage} 關 通過`;
  $('st-big').textContent  = last ? '六關全破'
    : `前往第 ${G.stage + 1} 關`;
  // a hard-coded count goes stale every time songs are added
  $('st-line').textContent = last
    ? `整個題庫 ${(window.SONGS || []).length} 首、六道門檻,你一關都沒有掉。` : '';
  $('st-facts').innerHTML  = stageFacts(st, true);
  // clearing all six is the moment worth sharing, so that slot becomes share
  G.shareText = last
    ? `我在金曲猜歌王挑戰中六關全破囉。你也來試試看吧！`
    : G.shareText;
  $('btn-stage-go').hidden = false;
  $('btn-stage-go').textContent = last ? '分享這個成績' : `進入第 ${G.stage + 1} 關`;
  $('btn-stage-quit').textContent = last ? '回到首頁' : '先不玩了';

  // restart the animation: remove, force reflow, re-add, or back-to-back clears do not animate
  pop.hidden = false;
  pop.classList.remove('in');
  void pop.offsetWidth;
  pop.classList.add('in');
  (last ? $('btn-stage-quit') : $('btn-stage-go')).focus({ preventScroll: true });
}

function closePop(){
  const pop = $('pop');
  pop.classList.remove('in');
  pop.hidden = true;
}

/* Failed the threshold. Reuses the result screen, but leads with how far you
   got rather than the score — "I reached stage 3" is the line people share. */
function failStage(st){
  closePop();
  $('btn-again').textContent   = '再闖一次';
  const cleared = G.stage - 1;
  const gap = st.need - G.total;
  $('res-title').textContent = cleared > 0 ? `闖到第 ${cleared} 關` : '第 1 關就卡住了';
  $('res-line').textContent  = cleared > 0
    ? `倒在第 ${G.stage} 關的 ${st.need.toLocaleString()} 分門檻前`
    : '全語系從第一關開放，再試一次！';
  $('res-score').textContent = G.total.toLocaleString();
  $('res-meta').textContent  =
    `第 ${G.stage} 關要 ${st.need.toLocaleString()} 分 · 差 ${gap.toLocaleString()} 分` +
    ` · 最佳紀錄 第 ${Store.bestStage()} 關`;

  G.shareText = cleared > 0
    ? `我在金曲猜歌王挑戰中闖到第 ${cleared} 關(共 ${STAGES.length} 關)
` +
      `倒在第 ${G.stage} 關的 ${st.need.toLocaleString()} 分門檻前。你也來挑戰看看吧！`
    : `我在金曲猜歌王挑戰中連第 1 關都沒過，不然你來玩玩看吧！`;

  const nextEl = $('res-next');
  nextEl.innerHTML = `再玩一次會<b>從第 1 關重新開始</b>`;
  nextEl.hidden = false;

  const missed = G.log.filter(r => !r.correct);
  $('res-misses').innerHTML = missed.length
    ? `<h4>沒答出來的</h4><ul>${missed.map(r =>
        `<li><b>${escapeHtml(r.song.title)}</b><span>${escapeHtml(r.song.artist)}</span></li>`).join('')}</ul>`
    : `<h4>全對</h4><div class="none">十題全中,但門檻是看分數的 —— 再快一點</div>`;

  show('screen-result');
}

$('btn-stage-go').addEventListener('click', () => {
  if(G.stage >= STAGES.length) return doShare();      // on the final clear this button shares and leaves the popup open
  closePop(); G.stage++; playRound();
});
$('btn-stage-quit').addEventListener('click', () => { closePop(); show('screen-start'); });

/* ---------- share ----------

   No server, so there is no share page — what goes out is a line of text
   plus the game URL. On phones that means the system share sheet (Web Share
   API), the same entry point IG stories, LINE and Threads all read. Desktop
   has no sheet, so it falls back to the clipboard.

   The text has to stand alone: whoever receives it has not played, so
   numbers like "stage 3" or "17/46" carry their unit and their total. */
function shareLine(){
  // drop a trailing index.html so the shared link is the clean one
  const url = (location.origin + location.pathname).replace(/index\.html$/, '');
  return { text: G.shareText || '金曲猜歌王', url };
}

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  document.body.appendChild(t);
  return t;
}

async function doShare(){
  const { text, url } = shareLine();
  if(navigator.share){
    try{
      await navigator.share({ title: '金曲猜歌王', text, url });
      return;                                   // the sheet opened; do not also copy
    }catch(e){
      if(e && e.name === 'AbortError') return;  // the user dismissed the sheet; not a failure
    }
  }
  /* clipboard.writeText hangs indefinitely when the document is not focused —
     it does not reject, it just never returns. A button that does nothing is
     the worst outcome, so cap it at 1.5s and treat a timeout as failure. */
  const write = navigator.clipboard
    ? navigator.clipboard.writeText(text + '\n' + url).then(() => true, () => false)
    : Promise.resolve(false);
  const copied = await Promise.race([
    write,
    new Promise(r => setTimeout(() => r(false), 1500))
  ]);
  const t = copied
    ? toast('已複製,貼到哪裡都可以', 'good')
    : toast('複製不了 —— 直接截圖分享吧', 'bad');
  setTimeout(() => t.remove(), 2200);
}

$('btn-share').addEventListener('click', doShare);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- desktop testing: keys 1-9 answer ---------- */
document.addEventListener('keydown', e => {
  if($('screen-play').hidden || G.locked) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 9){
    const el = $('grid').children[n-1];
    if(el) el.click();
  }
});

/* ---------- boot ---------- */
setVolume(volume);   // apply the remembered volume to the slider and icon
refreshStartBtn();
$('library-info').textContent = `${window.SONGS.length} 首歌曲 · 全語系開放 · 此裝置跨場避重`;
</script>
